
{% extends "core/base.html" %}

{% block title %}Register - RhythmiQ{% endblock %}

{% block content %}

<section class="auth-wrap">
    <div class="panel auth-card">

        <p class="eyebrow">Join RhythmiQ</p>

        <h1>Create an account</h1>

        <p class="muted">
            Join the experience. Your music, your vibe.
        </p>

        <form method="post" class="auth-form">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="btn btn-primary full-width">
                Create account
            </button>
        </form>

        <p class="muted" style="margin-top: 24px;">
            Already have an account?
            <a href="{% url 'login' %}" class="muted-link">
                Log in
            </a>
        </p>

    </div>
</section>

{% endblock %}
